# Run once before the suite (e2e/android/run.sh, #361): the first launch on a
# freshly booted emulator is the slow one. A system "isn't responding" dialog
# can come back more than once while the emulator settles (on Nov 24 it was the
# Pixel Launcher, twice), so dismiss dialogs in a loop until Events shows, up to
# about 3 minutes. If it never does, the run fails as "environment", not as four
# flow failures.
appId: com.vteamvolleyball.app
name: Warm-up (app reaches Events)
---
- launchApp:
    clearState: true
- repeat:
    while:
      notVisible:
        id: filter-all
    times: 18
    commands:
      - runFlow: _dialogs.yaml
      - extendedWaitUntil:
          visible:
            id: filter-all
          timeout: 10000
          optional: true
- assertVisible:
    id: filter-all
