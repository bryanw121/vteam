name: Schema drift

# Daily check that the live and beta Supabase projects still have the same
# schema (CI also runs it on every PR/push, in the Web build job). A failure
# here means something changed one project outside a PR (dashboard edit, a
# migration applied to only one): GitHub emails the repo owner about failed
# scheduled runs.
#
# The second job checks that the edge functions deployed on live match main
# (scripts/functions-drift.mjs): deployed at all, not older than the last change,
# verify_jwt as in supabase/config.toml. It only reads (Management API) and is
# skipped with a notice until a SUPABASE_ACCESS_TOKEN repository secret exists.
on:
  schedule:
    - cron: '41 13 * * *' # 8:41 CT
  workflow_dispatch:

jobs:
  drift:
    name: Live vs beta schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run db:drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  functions:
    name: Live edge functions vs repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the last commit touching each function's folder
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/functions-drift.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
