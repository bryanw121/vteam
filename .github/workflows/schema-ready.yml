name: Live schema ready

# Every push to main: is every migration this commit's merged PRs brought already
# on live? Vercel's Deployment Checks hold the production deploy until this check
# ("Live schema ready") passes, so the web app never runs code against a schema
# that doesn't have what it calls (#245). Code-only commits pass in seconds; a
# missing migration is named in the job summary and the job polls every 2 minutes
# for up to 3 hours, passing by itself once it's applied. Read-only on both
# Supabase projects (public anon keys, the same functions as the drift check).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: schema-ready-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ready:
    name: Live schema ready
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/schema-drift.mjs --ready "$GITHUB_SHA" --wait 180
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
