<html><head><link rel=stylesheet href=common.css><style>
body{padding:28px;width:1100px}.wrap{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:24px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.t{font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--border)}
.c{background:#0f3a2a;color:#9ff0c7;border-color:#1d6b4c}.u{background:var(--card);color:var(--subS)}.z{background:#3b1d24;color:#ffb3b3;border-color:#6b2a35}
.leg{display:flex;gap:18px;margin:6px 0 16px;font-size:14px;color:var(--subS)}.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
</style></head><body><div class=wrap><div class=lbl>RLS coverage today: public tables named in e2e/rls.spec.ts (live schema, 2026-11-05)</div>
<div class=leg><span><i class="sw c" style="background:#1d6b4c"></i>asserted (19)</span><span><i class=sw style="background:#2C2848"></i>no assertion (31)</span><span><i class=sw style="background:#6b2a35"></i>no assertion, 0 policies: service-only (1)</span></div>
<div class=grid id=g></div></div>
<script>
const cov=new Set(["app_events", "app_events_daily", "clubs", "conversation_members", "conversations", "event_attendees", "event_payments", "event_reminder_log", "events", "feedback_submissions", "messages", "notifications", "point_balances", "point_events", "profiles", "push_tokens", "tags", "tournament_trophies", "user_settings"]),zero=new Set(['push_receipts']);const all=["app_events", "app_events_daily", "clubs", "conversation_members", "conversations", "event_attendees", "event_payments", "event_reminder_log", "events", "feedback_submissions", "messages", "notifications", "point_balances", "point_events", "profiles", "push_tokens", "tags", "tournament_trophies", "user_settings", "ad_banners", "ad_free_passes", "app_config", "chat_silences", "cheers", "club_members", "club_post_comments", "club_post_likes", "club_posts", "event_cohosts", "event_comments", "event_guests", "event_tags", "external_sessions", "major_cities", "message_reactions", "push_receipts", "sponsored_events", "tournament_comments", "tournament_matches", "tournament_pool_teams", "tournament_pools", "tournament_prizes", "tournament_rules", "tournament_sets", "tournament_team_invitations", "tournament_team_join_requests", "tournament_team_members", "tournament_teams", "tournaments", "user_badges", "user_event_templates"];
document.getElementById('g').innerHTML=all.map(t=>`<div class="t ${cov.has(t)?'c':zero.has(t)?'z':'u'}">${t}</div>`).join('')
</script></body></html>
