<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3FF;--card:#FFFFFF;--ink:#1E1033;--sub:#6B5B85;--p:#7445F7;--pt:#6D28D9;--soft:#EDE6FA;--time:#EDE6FA;--timeInk:#5B21B6;--border:#E4DAF5;--open:#7C3AED;--tour:#DB2777;--nav:#E9E0FF;--navInk:#5B4B78}
body{margin:0;background:#fff;font-family:Outfit,system-ui,sans-serif;color:var(--ink)}
.phone{width:390px;height:844px;background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:8px}.phone>*{flex-shrink:0}.tp{white-space:nowrap;flex-shrink:0}
.h1{font-size:34px;font-weight:800;letter-spacing:-1.2px;flex:1}
.h1 i{color:var(--p);font-style:normal}
.ib{width:44px;height:44px;border-radius:999px;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(30,16,51,.06)}
.pill{height:40px;padding:0 14px;border-radius:999px;background:var(--card);display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;box-shadow:0 2px 8px rgba(30,16,51,.06)}
.pill.on{background:var(--soft);color:var(--pt);box-shadow:inset 0 0 0 1.5px var(--pt)}
.signin{height:44px;padding:0 18px;border-radius:999px;background:var(--p);color:#fff;display:flex;align-items:center;font-size:16px;font-weight:700}
.days{display:flex;gap:8px;padding:4px 20px 10px;overflow:hidden}
.day{flex-shrink:0;width:50px;padding:7px 0;border-radius:16px;text-align:center;background:var(--card)}
.day .w{font-size:12px;color:var(--sub)}.day .n{font-size:20px;font-weight:700}
.day.on{background:var(--p);color:#fff}.day.on .w{color:#fff;opacity:.85}
.dot{width:5px;height:5px;border-radius:9px;background:var(--p);margin:2px auto 0}
.day.on .dot{background:#fff}
.sec{display:flex;align-items:baseline;padding:6px 20px 8px}
.sec b{flex:1;font-size:20px;font-weight:800}.sec span{font-size:13px;color:var(--sub)}
.list{display:flex;flex-direction:column;gap:12px;padding:0 20px}
.vt{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 2px 10px rgba(30,16,51,.08)}
.cover{position:relative;height:112px;overflow:hidden}
.cover .r1{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:999px;border:18px solid rgba(255,255,255,.16)}
.cover .r2{position:absolute;right:40px;bottom:-40px;width:90px;height:90px;border-radius:999px;background:rgba(255,255,255,.12)}
.badge{position:absolute;left:14px;top:12px;padding:4px 10px;border-radius:999px;background:#fff;color:var(--pt);font-size:12px;font-weight:700}
.more{position:absolute;right:10px;top:8px;width:36px;height:36px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:800;letter-spacing:1px;font-size:14px}
.ctitle{position:absolute;left:16px;right:16px;bottom:10px;color:#fff;font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.body{padding:11px 14px 13px 16px;display:flex;align-items:center;gap:10px}
.tp{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;background:var(--time);color:var(--timeInk);font-size:15px;font-weight:700}
.l1{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;min-width:0}
.l1 .where{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--sub)}
.av{display:flex}.av span{width:22px;height:22px;border-radius:99px;background:var(--soft);color:var(--pt);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-left:-5px;border:2px solid #fff}
.av span:first-child{margin-left:0}
.spots{font-weight:700;color:var(--ink)}
.join{height:44px;padding:0 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;flex-shrink:0}
.going{height:44px;padding:0 14px;border-radius:999px;background:var(--soft);color:var(--pt);font-size:15px;font-weight:700;display:flex;align-items:center;flex-shrink:0}
.out{background:var(--card);border-radius:20px;padding:12px 10px 12px 12px;display:flex;gap:12px;align-items:center;border:1.5px dashed #D9CCF0}
.tt{width:54px;height:54px;border-radius:16px;background:var(--soft);color:var(--pt);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1.05}
.tt b{font-size:17px}.tt small{font-size:11px;font-weight:600}
.out .t{font-size:16px;font-weight:700}.out .m{font-size:13px;color:var(--sub);margin-top:2px}
.share{width:44px;height:44px;border-radius:999px;background:var(--soft);color:var(--pt);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav{position:absolute;left:20px;right:20px;bottom:16px;height:62px;border-radius:999px;background:var(--nav);color:var(--navInk);display:flex;justify-content:space-around;align-items:center;font-size:13px;box-shadow:0 2px 12px rgba(30,16,51,.12)}
.plus{width:48px;height:48px;border-radius:999px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px}
.rail{display:flex;gap:10px;padding:0 20px 12px;overflow:hidden}
.rc{width:220px;flex-shrink:0;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 2px 10px rgba(30,16,51,.08);display:flex;flex-direction:column}
.rc .strip{height:34px;flex-shrink:0;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;padding:0 12px}
.rc .in{padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.rc .when{display:none}.rc .t{font-size:15px;font-weight:700}.rc .m{font-size:13px;color:var(--sub)}
.tag{align-self:flex-start;margin-top:3px;height:24px;padding:0 10px;border-radius:999px;background:var(--soft);color:var(--pt);font-size:12px;font-weight:700;display:flex;align-items:center}
.label{font-size:15px;font-weight:700;padding:2px 20px 8px}
.leagues{margin:0 20px;display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:16px;background:var(--card);font-size:14px;font-weight:600;color:var(--pt)}
.sheetbg{position:absolute;inset:0;background:rgba(30,16,51,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px 26px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--border);margin:0 auto 14px}
.sh{font-size:22px;font-weight:800;margin-bottom:14px}
.grp{font-size:13px;font-weight:700;color:var(--sub);margin:10px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--border);display:flex;align-items:center;font-size:15px;font-weight:600}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.btns{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;height:50px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
</style></head><body>
<div id="root"></div>
<script>
const I={search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
bell:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 004 0"/></svg>',
filter:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
pin:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
clock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2" stroke="#EDE6FA" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>',
share:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>',
chev:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
cal:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'};
const vt=(title,time,where,avs,spots,kind,signed,going)=>`<div class="vt"><div class="cover" style="background:var(--${kind})"><div class="r1"></div><div class="r2"></div><div class="badge">Hosted on vteam</div><div class="more">•••</div><div class="ctitle">${title}</div></div>
<div class="body"><div style="flex:1;min-width:0"><div class="l1"><span class="tp">${I.clock}${time}</span><span class="where">${where}</span></div>
<div class="l2"><span class="av">${avs.map(a=>`<span>${a}</span>`).join('')}</span><span class="spots">${spots}</span></div></div>${going?'<div class="going">Going ✓</div>':'<div class="join">Join</div>'}</div></div>`;
const out=(t1,t2,title,meta)=>`<div class="out"><div class="tt"><b>${t1}</b><small>${t2}</small></div><div style="flex:1;min-width:0"><div class="t">${title}</div><div class="m">${meta}</div></div><div class="share">${I.share}</div></div>`;
const days=(sel)=>`<div class="days">${[['Fri',27,1],['Sat',28,1],['Sun',29,1],['Mon',30,1],['Tue','Dec 1',0],['Wed',2,1],['Thu',3,0]].map(([w,n,d],i)=>`<div class="day ${i===sel?'on':''}"><div class="w">${w}</div><div class="n" style="${String(n).length>3?'font-size:14px;padding:3px 0':''}">${n}</div>${d?'<div class="dot"></div>':'<div style="height:7px"></div>'}</div>`).join('')}</div>`;
const header=(signed,filterOn)=>`<div class="row" style="padding:14px 20px 6px"><div class="h1">Events<i>.</i></div><div class="ib">${I.search}</div>${signed?`<div class="ib" style="position:relative">${I.bell}<span style="position:absolute;right:11px;top:10px;width:8px;height:8px;border-radius:9px;background:#BE185D"></span></div>`:'<div class="signin">Sign in</div>'}</div>
<div class="row" style="padding:4px 20px 10px"><div class="pill">${I.pin}Austin ${I.chev}</div><div class="pill ${filterOn?'on':''}">${I.filter}${filterOn?'Tournament · Sand':'Filter'}</div></div>`;
const nav=`<div class="nav"><div style="color:var(--pt);font-weight:700">Events</div><div>Clubs</div><div class="plus">+</div><div>Chat</div><div>Me</div></div>`;
const feed=(signed)=>`<div class="sec"><b>Today</b><span>Fri, Nov 27 · 4 games</span></div><div class="list">
${vt('Lunchtime Pepper &amp; Passing','12:00 PM','Pease Park','PMZ'.split(''),'5 spots left','open',signed)}
${out('6:00','to 9','Open Gym','Volleyworld · Indoor open play · $12')}
${vt('Rec Center 6s Night','7:00 PM','Austin Sports Center','JMP+'.split('').map(x=>x==='+'?'+13':x),'2 spots left','open',signed,signed)}
${out('7:30','to 10','Reverse Co-ed 4s','Volleyworld · Indoor · $12')}
</div>`;
const V=new URLSearchParams(location.search).get('v');
let h='';
if(V==='guest') h=`<div class="phone">${header(false)}${days(0)}${feed(false)}${nav}</div>`;
if(V==='signed') h=`<div class="phone">${header(true)}${days(0)}<div class="label">You're signed up · 3</div><div class="rail">
<div class="rc"><div class="strip" style="background:var(--open)">Tonight · 7:00 PM</div><div class="in"><div class="t">Rec Center 6s Night</div><div class="m">Austin Sports Center</div><div class="tag">Going</div></div></div>
<div class="rc"><div class="strip" style="background:var(--open)">Sat · 4:00 PM</div><div class="in"><div class="t">Sand Doubles at Butler</div><div class="m">Butler Park</div><div class="tag">Hosting</div></div></div></div>${feed(true)}${nav}</div>`;
if(V==='sheet') h=`<div class="phone">${header(true)}${days(0)}${feed(true)}${nav}<div class="sheetbg"></div><div class="sheet"><div class="grab"></div><div class="sh">Filter games</div>
<div class="grp">Type</div><div class="chips"><div class="chip">All</div><div class="chip">Open play</div><div class="chip on">Tournament</div></div>
<div class="grp">Surface</div><div class="chips"><div class="chip">Any</div><div class="chip">Indoor</div><div class="chip on">Sand</div><div class="chip">Grass</div></div>
<div class="leagues" style="margin:18px 0 0;background:var(--bg)">${I.cal}Leagues open for sign-up · 3<span style="flex:1"></span>›</div>
<div class="btns"><div class="btn" style="background:var(--soft);color:var(--pt)">Clear</div><div class="btn" style="background:var(--p);color:#fff">Show 6 games</div></div></div></div>`;
if(V==='filtered') h=`<div class="phone">${header(true,true)}${days(1)}<div class="sec"><b>Sat, Nov 28</b><span>2 games</span></div><div class="list">
${vt('Turkey Spikes Sand Tourney','9:00 AM','ATX Beach','AKL'.split(''),'3 teams left','tour',true)}
${out('Dec','3','Turkey Spikes BYO4s','ACES · ATX Beach · $160 a team · Sign up by Tue')}</div>${nav}</div>`;
if(V==='desktop'){h=`<div style="width:1280px;height:800px;background:var(--bg);display:flex;overflow:hidden">
<div style="width:224px;border-right:1px solid var(--border);padding:24px 16px;box-sizing:border-box"><div style="font-size:26px;font-weight:800;color:var(--pt)">vteam</div><div style="margin-top:28px;display:flex;flex-direction:column;gap:6px;font-size:15px">
<div style="padding:12px 14px;border-radius:14px;background:var(--soft);color:var(--pt);font-weight:700">Events</div><div style="padding:12px 14px">Clubs</div><div style="padding:12px 14px">Chat</div><div style="padding:12px 14px">Profile</div></div></div>
<div style="flex:1;padding:26px 28px;box-sizing:border-box;min-width:0">
<div class="row"><div class="h1">Events<i>.</i></div><div class="ib">${I.search}</div><div class="ib">${I.bell}</div></div>
<div class="row" style="margin:10px 0 18px"><div class="pill">${I.pin}Austin ${I.chev}</div><div class="pill">${I.filter}Filter</div></div>
<div class="label" style="padding:0 0 8px">You're signed up · 3</div><div class="rail" style="padding:0 0 18px">
<div class="rc"><div class="strip" style="background:var(--open)">Tonight · 7:00 PM</div><div class="in"><div class="t">Rec Center 6s Night</div><div class="m">Austin Sports Center</div><div class="tag">Going</div></div></div>
<div class="rc"><div class="strip" style="background:var(--open)">Sat · 4:00 PM</div><div class="in"><div class="t">Sand Doubles at Butler</div><div class="m">Butler Park</div><div class="tag">Hosting</div></div></div></div>
<div class="sec" style="padding:0 0 10px"><b>Fri, Nov 27 · Today</b><span>4 games</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
${vt('Lunchtime Pepper &amp; Passing','12:00 PM','Pease Park','PMZ'.split(''),'5 spots left','open',true)}
${vt('Rec Center 6s Night','7:00 PM','Austin Sports Center',['J','M','P','+13'],'2 spots left','open',true,true)}
${out('6:00','to 9','Open Gym','Volleyworld · Indoor open play · $12')}
${out('7:30','to 10','Reverse Co-ed 4s','Volleyworld · Indoor · $12')}</div></div>
<div style="width:300px;border-left:1px solid var(--border);padding:24px 20px;box-sizing:border-box"><div style="font-size:12px;font-weight:700;color:var(--sub)">THIS WEEK</div><div style="margin-top:10px;background:var(--card);border-radius:20px;height:330px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px">Month calendar (unchanged)</div></div></div>`;}
document.getElementById('root').innerHTML=h;
</script></body></html>
