<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vteam logo directions</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      body { margin: 0; background: #110c1b; color: #fff; }
      main { max-width: 1200px; margin: auto; padding: 32px 20px 56px; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 28px; color: #c9bfd8; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 22px; }
      figure { margin: 0; overflow: hidden; border: 1px solid #3b2e4e; border-radius: 18px; background: #20172d; }
      img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #0e0917; }
      figcaption { padding: 14px 16px 16px; font-weight: 700; }
      figcaption span { display: block; margin-top: 5px; color: #b8aac8; font-size: 14px; font-weight: 400; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vteam logo directions</h1>
      <p>Fresh concepts — four deliberately different visual systems.</p>
      <section class="grid">
        <figure><img src="vteam-logo-heritage-club.png" alt="Heritage club logo"><figcaption>Heritage club<span>Established, formal sports identity</span></figcaption></figure>
        <figure><img src="vteam-logo-geometric-tech.png" alt="Geometric tech logo"><figcaption>Geometric tech<span>Abstract, contemporary product mark</span></figcaption></figure>
        <figure><img src="vteam-logo-friendly-app.png" alt="Friendly app logo"><figcaption>Friendly app<span>Approachable volleyball-first app icon</span></figcaption></figure>
        <figure><img src="vteam-logo-court-connection.png" alt="Court connection logo"><figcaption>Court connection<span>Ball, net, and court in one mark</span></figcaption></figure>
      </section>
    </main>
  </body>
</html>
